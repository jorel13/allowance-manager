<!-- config-editor.html -->
<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Edit Config</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
        }

        textarea {
            width: 100%;
            height: 300px;
            font-family: monospace;
            font-size: 14px;
        }

        button {
            margin-top: 10px;
            padding: 8px 12px;
        }

        #message {
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h1>Edit Config</h1>
    <textarea id="configText"></textarea>
    <br>
    <button id="saveButton">Save</button>
    <p id="message"></p>
    <script src="config-editor.js"></script>
</body>

</html>
